<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPTV Working Channels</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #0a0e14; color: #e6e6e6; font-family: -apple-system, Arial, sans-serif; }
body { padding: 16px; }
h1 { font-size: 22px; margin: 0 0 12px; }
.sub { color: #8a94a6; font-size: 13px; margin-bottom: 16px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
select, input { background: #151a22; color: #e6e6e6; border: 1px solid #252b36; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
select:focus, input:focus { outline: none; border-color: #3b82f6; }
select[multiple] { min-height: 90px; min-width: 160px; }
input { flex: 1; min-width: 200px; }
.btn { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
.btn.reset { background: #374151; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.stat { background: #11151d; border: 1px solid #252b36; border-radius: 10px; padding: 10px 14px; font-size: 13px; }
.stat b { color: #22c55e; font-size: 16px; display: block; margin-top: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card { background: #11151d; border: 1px solid #252b36; border-radius: 10px; padding: 12px; transition: border-color 0.15s; }
.card:hover { border-color: #3b82f6; }
.card .name { font-weight: 600; font-size: 14px; margin-bottom: 6px; word-break: break-word; }
.card .meta { font-size: 11px; color: #8a94a6; }
.card .badge { display: inline-block; background: #1e3a5f; color: #7dd3fc; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin-top: 6px; margin-right: 4px; }
.card .badge.cat { background: #2a1f4a; color: #c4b5fd; }
.card .badge.lang { background: #14402a; color: #86efac; }
.card .play { display: inline-block; margin-top: 8px; font-size: 11px; color: #3b82f6; text-decoration: none; }
.card .play:hover { text-decoration: underline; }
#result { color: #8a94a6; font-size: 13px; margin-bottom: 10px; }
</style>
</head>
<body>

<h1>IPTV Working Channels</h1>
<div class="sub">GitHub hosted • Auto-updated • Category & language filter</div>

<div class="filters">
  <select id="langFilter" multiple>
    <option value="">All Languages</option>
  </select>
  <select id="catFilter" multiple>
    <option value="">All Categories</option>
  </select>
  <input id="search" placeholder="Search channel...">
  <button class="btn" onclick="applyFilters()">Apply</button>
  <button class="btn reset" onclick="resetFilters()">Reset</button>
</div>

<div class="stats" id="stats"></div>

<div id="result">Loading...</div>

<div class="grid" id="grid"></div>

<script>
let allChannels = [];

async function loadPlaylist() {
  try {
    const res = await fetch('working_unique.m3u?_=' + Date.now(), { cache: 'no-store' });
    const text = await res.text();
    allChannels = parseM3U(text);
    console.log('Loaded ' + allChannels.length + ' channels');
    buildFilters();
    renderStats();
    applyFilters();
  } catch (e) {
    document.getElementById('result').textContent = 'Error: ' + e.message;
  }
}

function parseM3U(text) {
  const lines = text.split(/\r?\n/);
  const out = [];
  let current = null;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith('#EXTINF:')) {
      const name = line.split(',').slice(1).join(',').trim();
      const groupMatch = line.match(/group-title="([^"]*)"/i);
      const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
      const langMatch = line.match(/tvg-language="([^"]*)"/i);
      current = {
        name: name,
        group: groupMatch ? groupMatch[1] : 'General',
        logo: logoMatch ? logoMatch[1] : '',
        lang: langMatch ? langMatch[1] : ''
      };
    } else if (current && line && !line.startsWith('#')) {
      current.url = line;
      out.push(current);
      current = null;
    }
  }
  return out;
}

function buildFilters() {
  const langs = new Set();
  const cats = new Set();
  allChannels.forEach(c => {
    if (c.lang) langs.add(c.lang);
    if (c.group) cats.add(c.group);
  });

  const langSel = document.getElementById('langFilter');
  langSel.innerHTML = '';
  [...langs].sort().forEach(l => {
    const opt = document.createElement('option');
    opt.value = l;
    opt.textContent = l;
    langSel.appendChild(opt);
  });

  const catSel = document.getElementById('catFilter');
  catSel.innerHTML = '';
  [...cats].sort().forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    catSel.appendChild(opt);
  });
}

function getSelected(select) {
  return [...select.selectedOptions].map(o => o.value).filter(v => v !== '');
}

function applyFilters() {
  const langs = getSelected(document.getElementById('langFilter'));
  const cats = getSelected(document.getElementById('catFilter'));
  const search = document.getElementById('search').value.toLowerCase();

  let filtered = allChannels;
  if (langs.length > 0) filtered = filtered.filter(c => langs.includes(c.lang));
  if (cats.length > 0) filtered = filtered.filter(c => cats.includes(c.group));
  if (search) filtered = filtered.filter(c => c.name.toLowerCase().includes(search));

  renderGrid(filtered);
}

function resetFilters() {
  document.getElementById('langFilter').selectedIndex = -1;
  document.getElementById('catFilter').selectedIndex = -1;
  document.getElementById('search').value = '';
  applyFilters();
}

function renderStats() {
  const stats = document.getElementById('stats');
  const langs = new Set(allChannels.map(c => c.lang).filter(Boolean));
  const cats = new Set(allChannels.map(c => c.group).filter(Boolean));
  stats.innerHTML = `
    <div class="stat">Total Channels<b>${allChannels.length}</b></div>
    <div class="stat">Languages<b>${langs.size}</b></div>
    <div class="stat">Categories<b>${cats.size}</b></div>
  `;
}

function renderGrid(list) {
  const grid = document.getElementById('grid');
  document.getElementById('result').textContent = 'Showing ' + list.length + ' channels';

  grid.innerHTML = list.map(c => `
    <div class="card">
      <div class="name">${escapeHtml(c.name)}</div>
      <div class="meta">
        ${c.group ? `<span class="badge cat">${escapeHtml(c.group)}</span>` : ''}
        ${c.lang ? `<span class="badge lang">${escapeHtml(c.lang)}</span>` : ''}
      </div>
      <a class="play" href="${escapeHtml(c.url)}" target="_blank">▶ Play</a>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

// Auto-apply on select change
document.getElementById('langFilter').addEventListener('change', applyFilters);
document.getElementById('catFilter').addEventListener('change', applyFilters);
document.getElementById('search').addEventListener('input', applyFilters);

loadPlaylist();
</script>

</body>
</html>
